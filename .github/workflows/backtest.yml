name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum"
        type: string
        default: "2005-01-01"
      classes:
        description: "Assetklassen, komma getrennt"
        type: string
        default: "aktie_us,etf"
      cost_bps:
        description: "Handelskosten in Basispunkten je Umschichtung"
        type: string
        default: "10"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest rechnen
        run: |
          python -m agent.run_backtest \
            --start "${{ inputs.start }}" \
            --classes "${{ inputs.classes }}" \
            --cost-bps "${{ inputs.cost_bps }}"
      - name: Ergebnis committen
        run: |
          git config user.name "don-elias-agent"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Backtest $(date -u +%Y-%m-%d)" && git push)
      - name: Report in die Zusammenfassung
        if: always()
        run: cat reports/backtest.md >> $GITHUB_STEP_SUMMARY || true
