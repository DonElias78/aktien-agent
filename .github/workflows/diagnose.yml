name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Quellen einzeln testen
        run: |
          python3 - <<'PY' | tee diagnose_result.txt
          import urllib.request, urllib.error, datetime
          UA_BOT = "don-elias-aktien-agent/1.0 (+github actions)"
          UA_BROWSER = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                        "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          print("Diagnose vom", datetime.datetime.utcnow().isoformat(), "UTC")
          ziele = [
              ("kontrolle example.com", "https://example.com", UA_BOT),
              ("stooq bot UA", "https://stooq.com/q/d/l/?s=aapl.us&i=d", UA_BOT),
              ("stooq browser UA", "https://stooq.com/q/d/l/?s=aapl.us&i=d", UA_BROWSER),
              ("stooq startseite", "https://stooq.com/", UA_BROWSER),
              ("stooq pl domain", "https://stooq.pl/q/d/l/?s=aapl.us&i=d", UA_BROWSER),
              ("coingecko ping bot UA", "https://api.coingecko.com/api/v3/ping", UA_BOT),
              ("coingecko ping browser UA", "https://api.coingecko.com/api/v3/ping", UA_BROWSER),
              ("coingecko preis", "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd", UA_BROWSER),
              ("yahoo chart", "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d", UA_BROWSER),
              ("frankfurter fx", "https://api.frankfurter.app/latest", UA_BROWSER),
              ("binance klines", "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=5", UA_BROWSER),
              ("coinbase spot", "https://api.coinbase.com/v2/prices/BTC-USD/spot", UA_BROWSER),
          ]
          for name, url, ua in ziele:
              try:
                  r = urllib.request.urlopen(
                      urllib.request.Request(url, headers={"User-Agent": ua}), timeout=25)
                  body = r.read()[:150]
                  print(f"OK    {name}: HTTP {r.status}, {len(body)} Bytes | {body[:110]!r}")
              except urllib.error.HTTPError as e:
                  print(f"HTTP  {name}: {e.code} | {e.read()[:150]!r}")
              except Exception as e:
                  print(f"FEHL  {name}: {e!r}")
          PY

      - name: Ergebnis ins Repo schreiben
        if: always()
        run: |
          git config user.name "don-elias-agent"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Diagnose $(date -u +%H:%M)" && git push)
