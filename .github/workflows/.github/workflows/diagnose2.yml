name: Diagnose 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Yahoo und CoinGecko pruefen
        run: |
          python3 - <<'PY' | tee diagnose2_result.txt
          import urllib.request, urllib.error, urllib.parse, json, time, datetime
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          def hol(url, timeout=25):
              return urllib.request.urlopen(
                  urllib.request.Request(url, headers={"User-Agent": UA}), timeout=timeout).read()

          print("Diagnose 2 vom", datetime.datetime.utcnow().isoformat(), "UTC")
          print("== Yahoo Historie je Symboltyp ==")
          Y = "https://query1.finance.yahoo.com/v8/finance/chart/{}?range=max&interval=1d&events=div%2Csplit"
          for sym, was in [("AAPL","US Aktie"), ("SAP.DE","DE Aktie"), ("SPY","ETF"),
                           ("^GSPC","Index SP500"), ("^GDAXI","Index DAX"),
                           ("GC=F","Gold Future"), ("XAUUSD=X","Gold Spot"),
                           ("BTC-USD","Krypto"), ("EURUSD=X","Devisen")]:
              try:
                  d = json.loads(hol(Y.format(urllib.parse.quote(sym))))
                  res = d["chart"]["result"][0]
                  ts = res["timestamp"]
                  ind = res["indicators"]
                  hat_adj = "adjclose" in ind
                  erst = datetime.date.fromtimestamp(ts[0])
                  letzt = datetime.date.fromtimestamp(ts[-1])
                  kurs = ind["quote"][0]["close"][-1]
                  print(f"OK    {sym:10} {was:12} {len(ts):6} Tage, {erst} bis {letzt}, letzter Kurs {kurs}, adjclose: {hat_adj}")
              except urllib.error.HTTPError as e:
                  print(f"HTTP  {sym:10} {was:12} {e.code} | {e.read()[:120]!r}")
              except Exception as e:
                  print(f"FEHL  {sym:10} {was:12} {e!r}")

          print("== Yahoo Belastungstest, 40 Abrufe ohne Pause ==")
          syms = ["MSFT","NVDA","AMZN","GOOGL","META","TSLA","AVGO","LLY","JPM","V",
                  "XOM","UNH","MA","COST","HD","PG","JNJ","WMT","NFLX","CRM",
                  "BAC","ORCL","AMD","CVX","KO","PEP","ADBE","MRK","TMO","LIN",
                  "ACN","MCD","CSCO","ABT","PM","IBM","GE","TXN","QCOM","INTU"]
          ok = 0; fehler = []
          t0 = time.time()
          for s in syms:
              try:
                  hol(f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?range=5y&interval=1d")
                  ok += 1
              except Exception as e:
                  fehler.append(f"{s}:{type(e).__name__}:{str(e)[:40]}")
          print(f"{ok} von {len(syms)} erfolgreich in {time.time()-t0:.0f} Sekunden")
          if fehler:
              print("Fehler:", fehler[:10])

          print("== CoinGecko Historie, mit und ohne interval ==")
          for name, url in [
              ("mit interval=daily", "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=max&interval=daily"),
              ("ohne interval", "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=max"),
              ("ohne interval 365 Tage", "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365"),
              ("markets top 5", "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=5&page=1"),
          ]:
              try:
                  d = json.loads(hol(url))
                  n = len(d.get("prices", [])) if isinstance(d, dict) else len(d)
                  print(f"OK    {name}: {n} Eintraege")
              except urllib.error.HTTPError as e:
                  print(f"HTTP  {name}: {e.code} | {e.read()[:160]!r}")
              except Exception as e:
                  print(f"FEHL  {name}: {e!r}")
          PY

      - name: Ergebnis ins Repo schreiben
        if: always()
        run: |
          git config user.name "don-elias-agent"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Diagnose 2 $(date -u +%H:%M)" && git push)
